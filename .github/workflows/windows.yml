name: Windows validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install pinned Rust
        run: rustup show
      - run: pnpm install --frozen-lockfile
      - name: Verify Windows launcher and distribution scripts
        shell: powershell
        run: .\scripts\test-windows-distribution.ps1
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --all --check
      - name: Package regular, offline and portable builds with checksums
        shell: powershell
        run: .\scripts\package-release.ps1 -AllowUnsigned
      - uses: actions/upload-artifact@v4
        with:
          name: TokenFuel-Windows
          path: |
            artifacts/release/v*/*.exe
            artifacts/release/v*/*.zip
            artifacts/release/v*/SHA256SUMS.txt
            artifacts/release/v*/SIGNATURES.json
            artifacts/release/v*/winget/**
          retention-days: 14
