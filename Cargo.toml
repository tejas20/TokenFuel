[workspace]
members = ["crates/tokenfuel-core", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
